<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Architect — Simple Drawing Practice</title>
  <meta name="description" content="A simple architectural drawing prompt generator with a focused timer. No account, no feed, just a brief to draw.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://wjr.github.io/pocket-architect/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="simple.css">
</head>
<body>
  <main class="simple-app">
    <header class="simple-header">
      <p class="eyebrow">Pocket Architect / Drawing practice</p>
      <h1>Draw something.</h1>
      <p class="instruction">Choose a level. Take the brief. Start.</p>
    </header>

    <section class="workbench" aria-label="Drawing prompt generator">
      <div class="skill" role="group" aria-label="Skill level">
        <button class="skill-btn" data-skill="beginner" type="button">Beginner</button>
        <button class="skill-btn" data-skill="intermediate" type="button">Intermediate</button>
        <button class="skill-btn" data-skill="advanced" type="button">Advanced</button>
      </div>

      <section class="cards" id="cards" aria-live="polite"></section>

      <div class="session-bar">
        <div class="timer">
          <div class="timer-presets" aria-label="Session length">
            <button class="preset-btn" data-minutes="15" type="button">15 min</button>
            <button class="preset-btn" data-minutes="30" type="button">30 min</button>
            <button class="preset-btn" data-minutes="45" type="button">45 min</button>
            <button class="preset-btn" data-minutes="0" type="button">Free</button>
          </div>
          <div class="timer-display" id="timer-display">15:00</div>
          <div class="timer-controls">
            <button id="timer-start" type="button">Start</button>
            <button id="timer-reset" type="button">Reset</button>
          </div>
        </div>

        <button class="reroll" id="reroll" type="button">New brief</button>
      </div>
    </section>

    <footer class="simple-footer">No account. No feed. Just a brief.</footer>
  </main>

  <script src="data.js"></script>
  <script src="image-map.js"></script>
  <script src="app.js"></script>
</body>
</html>
