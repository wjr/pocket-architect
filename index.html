<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Architect: Architectural Drawing Prompt Generator</title>
  <meta name="description" content="Free random drawing-prompt generator for architectural practice. Get a building type, perspective, and placement to sketch, then start your session.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#f1ebdc">

  <!-- Canonical + Open Graph assume a GitHub Pages deploy at the repo's
       default URL. Update these (and add an absolute og:image URL) if you
       host on a different domain. They are metadata only: no fetch, no
       network dependency, so the app stays fully offline under file://. -->
  <link rel="canonical" href="https://wjr.github.io/pocket-architect/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pocket Architect">
  <meta property="og:title" content="Pocket Architect: Architectural Drawing Prompts">
  <meta property="og:description" content="Free random drawing-prompt generator for architectural practice. Get a building type, perspective, and placement to sketch.">
  <meta property="og:url" content="https://wjr.github.io/pocket-architect/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Pocket Architect: Architectural Drawing Prompts">
  <meta name="twitter:description" content="Free random drawing-prompt generator for architectural practice.">

  <link rel="stylesheet" href="styles.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Pocket Architect",
    "description": "Free random drawing-prompt generator for architectural practice. Generates a building type, perspective, and placement to sketch.",
    "url": "https://wjr.github.io/pocket-architect/",
    "applicationCategory": "DesignApplication",
    "operatingSystem": "Web browser",
    "browserRequirements": "Requires JavaScript",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
</head>
<body>
  <main class="pa">
    <h1 class="pa-title">Pocket Architect</h1>

    <div class="skill" role="group" aria-label="Skill level">
      <button class="skill-btn" data-skill="beginner" type="button">Beginner</button>
      <button class="skill-btn" data-skill="intermediate" type="button">Intermediate</button>
      <button class="skill-btn" data-skill="advanced" type="button">Advanced</button>
    </div>

    <section class="cards" id="cards" aria-live="polite"></section>

    <div class="timer">
      <div class="timer-presets">
        <button class="preset-btn" data-minutes="15" type="button">15</button>
        <button class="preset-btn" data-minutes="30" type="button">30</button>
        <button class="preset-btn" data-minutes="45" type="button">45</button>
        <button class="preset-btn" data-minutes="0" type="button">Free draw</button>
      </div>
      <div class="timer-display" id="timer-display">15:00</div>
      <div class="timer-controls">
        <button id="timer-start" type="button">Start</button>
        <button id="timer-reset" type="button">Reset</button>
      </div>
    </div>

    <button class="reroll" id="reroll" type="button">Reroll</button>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
